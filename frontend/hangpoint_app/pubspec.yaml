name: hangpoint_app
description: "HangPoint - Group hangout planner app"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # API calls
  http: ^1.2.0
  
  # Save token locally
  shared_preferences: ^2.2.2
  
  # Secure token storage
  flutter_secure_storage: ^9.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true